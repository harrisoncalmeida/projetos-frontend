<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio harrisonca</title>

    <link rel="stylesheet" href="./src/css/style.css">

</head>
<body>
    <header class="header">
        <div class="header-content">
            <img class="header-logo" src="./src/img/Eu - 02 1.svg" alt="Imagem Harrison">
            <h1 class="header-tittle">Harrison Almeida</h1>
        </div>
        <div class="header-links">
            <a class="header-link" href="#">
                <img class="header-icone" src="./src/img/Visão Geral 1.svg" alt="Ícone Visão Geral">
                <span class="header-description">Visão Geral</span>
            </a>
            <a class="header-link" href="#">
                <img class="header-icone" src="./src/img/Projetos 1.svg" alt="Ícone Projetos">
                <span class="header-description">Projetos</span>
            </a>
            <a class="header-link" href="#">
                <img class="header-icone" src="./src/img/Contatos 1.svg" alt="Ícone Contatos">
                <span class="header-description">Contatos</span>
            </a>
        </div>
    </header>
</body>
</html>
